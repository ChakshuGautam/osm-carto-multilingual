server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress GeoJSON. Default gzip_types in the base image already covers application/json
    # and text/css, but not application/geo+json — add it explicitly.
    gzip on;
    gzip_types text/plain text/css application/json application/geo+json application/javascript text/javascript application/xml;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;

    # SPA / static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tile cache. Tiles are immutable per URL — long cache is intentional. If you change
    # the basemap style (e.g. swap dark for voyager) under the same URLs, version the path
    # (e.g. /tiles/v2/...) so browsers don't serve stale cached tiles.
    location /tiles/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # Admin GeoJSON. ~48 MB raw, ~13 MB gzipped on the wire.
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin *;
        types {
            application/geo+json geojson;
            application/json     json;
        }
    }
}
